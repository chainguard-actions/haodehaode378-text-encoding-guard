name: Test basic clean scan (no mojibake)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action on committed clean fixture directory
        id: action
        uses: .
        with:
          root: ${{ github.workspace }}/tests/fixtures/clean

      - name: Assert action succeeded (no mojibake found)
        run: |
          echo "Action completed successfully - no mojibake detected"
          echo "PASS"
