name: Test default root directory scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with explicit clean root pointing to fixture directory
        id: action
        uses: .
        with:
          root: ${{ github.workspace }}/tests/fixtures/clean

      - name: Assert action succeeded scanning clean root
        run: |
          echo "Action completed successfully scanning the clean root directory"
          echo "PASS: no mojibake found in the clean test files"
